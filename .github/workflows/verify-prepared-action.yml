name: Prepared-action Lean verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prepared-action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install checksum-pinned Lean 4.34.0
        run: bash verification/prepared-action/install-lean.sh "$RUNNER_TEMP/vivi-lean"
      - name: Kernel proofs, trust audit, and actual TypeScript conformance
        run: npm run verify:prepared-action
        env:
          LEAN: ${{ runner.temp }}/vivi-lean/lean-4.34.0-linux/bin/lean
